name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with ARG TERRAFORM_VERSION in the Dockerfile.
  TERRAFORM_VERSION: "1.12.2"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  test:
    name: Format, lint, validate, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive -diff
      - name: Init (no backend, lock file is read-only)
        run: terraform init -backend=false -lockfile=readonly
      - name: Validate
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: TFLint
        run: |
          tflint --init
          tflint --recursive --format compact
      - name: terraform test
        run: terraform test
      - name: Plan with the example dev variables
        run: terraform plan -var-file=env/dev.tfvars -out=tfplan

  docker:
    name: Docker image builds and runs the test suite
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: guide-app:ci
          build-args: TERRAFORM_VERSION=${{ env.TERRAFORM_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the tests inside the container
        run: docker run --rm guide-app:ci
